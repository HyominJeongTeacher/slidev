name: Deploy Microbit Piano

on:
  push:
    branches: [ microbit-piano ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Slidev
        run: |
          cd MicrobitPiano_2026
          npm ci || npm install
          npx @slidev/cli build --base "/slidev/" --out "../dist"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - uses: actions/deploy-pages@v4