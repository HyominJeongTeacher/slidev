name: Deploy Slidev Projects

on:
  push:
    branches: [ main ] # 또는 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Build All Projects
        run: |
          mkdir -p dist/slidev
          
          # 최상위에 있는 디렉터리 중 .으로 시작하지 않는 프로젝트 폴더들을 순회
          for dir in */; do
            # dist 폴더 및 점(.)으로 시작하는 폴더 제외
            if [ "$dir" != "dist/" ] && [ "${dir#\.}" = "$dir" ]; then
              proj=$(basename "$dir")
              
              # package.json 파일이 있는 경우에만 Slidev 프로젝트로 간주하여 빌드
              if [ -f "$dir/package.json" ]; then
                echo "=========================================="
                echo "Building project: $proj"
                echo "=========================================="
                cd "$dir"
                npm install
                npx slidev build --base "/slidev/$proj/" --out "../dist/slidev/$proj"
                cd ..
              fi
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4