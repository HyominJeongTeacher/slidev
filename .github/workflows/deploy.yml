name: Deploy Slidev Projects

on:
  push:
    branches: [ main ] # 또는 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Build All Projects
        run: |
          mkdir -p dist/slidev
          # slidev 폴더 안의 모든 하위 디렉터리 순회
          for dir in slidev/*/; do
            if [ -d "$dir" ]; then
              proj=$(basename "$dir")
              echo "Building $proj..."
              cd "$dir"
              npm install
              # base 경로를 /slidev/프로젝트명/ 으로 지정하여 빌드
              npx slidev build --base "/slidev/$proj/" --out "../../dist/slidev/$proj"
              cd ../..
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4