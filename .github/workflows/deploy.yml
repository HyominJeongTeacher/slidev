name: Deploy Slidev Projects

on:
  push:
    branches: [ main ] # 또는 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Build All Projects
        run: |
          mkdir -p dist

          # 1. 루트 진입 시 404를 방지하기 위한 기본 index.html 생성
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Slidev Presentations</title>
          </head>
          <body>
            <h1>Slidev Presentations List</h1>
            <p>프로젝트 슬라이드 목록:</p>
            <ul>
              <li><a href="./MicrobitPiano_2026/">MicrobitPiano_2026</a></li>
            </ul>
          </body>
          </html>
          EOF

          # 2. 루트 레벨의 프로젝트 폴더 순회 및 빌드
          for dir in */; do
            if [ "$dir" != "dist/" ] && [ "${dir#\.}" = "$dir" ]; then
              proj=$(basename "$dir")
              
              if [ -f "$dir/package.json" ]; then
                echo "=========================================="
                echo "Building project: $proj"
                echo "=========================================="
                cd "$dir"
                npm ci || npm install
                
                # relative base(./) 옵션으로 빌드하여 경로 오류 차단
                npx @slidev/cli build --base "./" --out "../dist/$proj" || echo "Failed to build $proj"
                
                # SPA 라우팅 지원을 위해 index.html을 404.html로 복사
                if [ -f "../dist/$proj/index.html" ]; then
                  cp "../dist/$proj/index.html" "../dist/$proj/404.html"
                fi
                cd ..
              fi
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4