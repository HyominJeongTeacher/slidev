name: Deploy Slidev Projects

on:
  push:
    branches: [ main ] # 또는 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Build All Projects
        run: |
          mkdir -p dist/slidev

          for dir in */; do
            if [ "$dir" != "dist/" ] && [ "${dir#\.}" = "$dir" ]; then
              proj=$(basename "$dir")
              
              if [ -f "$dir/package.json" ]; then
                echo "=========================================="
                echo "Building project: $proj"
                echo "=========================================="
                cd "$dir"
                npm ci || npm install
                # slidev 빌드 수행 (오류가 나도 다음 작업 진행되도록 감싸기)
                npx @slidev/cli build --base "/slidev/$proj/" --out "../dist/slidev/$proj" || echo "Failed to build $proj"
                cd ..
              fi
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4