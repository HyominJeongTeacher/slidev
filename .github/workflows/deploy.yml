name: Deploy Slidev Projects

on:
  push:
    branches: [ main ] # 또는 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 1. 빌드 작업
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Node 20 경고 해결

      - name: Install & Build All Projects
        run: |
          mkdir -p dist
          for dir in slidev/*/; do
            if [ -d "$dir" ]; then
              proj=$(basename "$dir")
              echo "Building $proj..."
              cd "$dir"
              npm install
              # --out 경로에서 slidev/ 중복 제거
              npx slidev build --base "/slidev/$proj/" --out "../../dist/$proj"
              cd ../..
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 2. 실제 배포 작업 (Settings에서 GitHub Actions 선택 시 활성화)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4